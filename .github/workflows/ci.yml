name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Syntaxe + tests (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Vérif syntaxe (node --check)
        run: for f in src/*.js; do node --check "$f"; done
      - name: Tests
        run: node --test
